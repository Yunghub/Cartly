[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
upload_port = COM16
monitor_port = COM16
monitor_speed = 115200

; Increase MQTT buffer to fit the 768-byte telemetry payload
build_flags =
    -D MQTT_MAX_PACKET_SIZE=1280

lib_deps =
    ; TFT/display driver (Arduino_GFX_Library.h)
    moononournation/GFX Library for Arduino@1.5.7
    ; MQTT client (PubSubClient.h)
    knolleary/PubSubClient
    ; QMI8658 IMU (QMI8658.h)
    lahavg/QMI8658
